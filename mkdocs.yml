site_name: Market Intel
site_description: Public framework for market intelligence, reporting, dashboards, and contracts
site_url: https://runchengxie.github.io/quant-intel-platform/
repo_url: https://github.com/runchengxie/quant-intel-platform
repo_name: runchengxie/quant-intel-platform
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/chart-line
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/runchengxie/quant-intel-platform
      name: GitHub

nav:
  - 首页: index.md
  - 入门:
      - 五分钟开始: getting-started.md
      - 核心概念: concepts.md
  - 常见任务:
      - 运行市场日报: how-to/run-daily-report.md
      - 生成网页看板: how-to/build-dashboard.md
      - 增加数据源: how-to/add-data-source.md
      - 常见问题: faq.md
  - 了解平台:
      - 系统架构: architecture.md
      - 数据所有权: data-ownership.md
      - 跨仓边界契约: boundary-contract.md
      - 数据契约: contracts.md
      - 术语表: glossary.md
  - 使用与配置:
      - 快速开始与配置: configuration.md
      - CLI 参考: cli-reference.md
      - 数据抓取架构: data-fetch-architecture.md
      - 评分方法: scoring.md
      - TA 方法: ta-methodology.md
      - 频率限制: rate-limits.md
  - 运维与开发:
      - 运维说明: operations.md
      - 测试: testing.md
      - 工作流: workflows.md
      - 报告结构: report-structure.md
      - 网页看板: web-dashboard.md
      - 日程: daily-schedule.md
      - 报告投递: report-distribution.md
      - 维护脚本: maintenance-scripts.md
      - 路线图: roadmap.md
      - 新机器设置: new-machine-setup.md
      - 代码质量审计: code-quality-audit-findings.md
  - 分析与研究:
      - A 股因子信号: a-share-factor-signals.md
      - 热点复合指标: hotspot-composite.md
      - 重构计划: refactor-plan-etl-report.md
      - 平台发布: platform-publication.md
      - Hermes 工作流: hermes-agent-workflow.md
      - 现金流影子投递: cashflow-feishu-shadow.md
  - 发布说明:
      - Public 仓库边界: public-release/public-boundary.md
      - 发布检查清单: public-release/public-release-checklist.md
      - 数据来源说明: public-release/data-provenance.md
