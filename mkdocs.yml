site_name: Quant Market Intel · Documentation
site_description: Public framework for market intelligence, reporting, dashboards, and contracts
site_url: https://runchengxie.github.io/quant-intel-platform/docs/
repo_url: https://github.com/runchengxie/quant-intel-platform
repo_name: runchengxie/quant-intel-platform
edit_uri: edit/main/docs/

# Historical/private migration material is kept in the repository for traceability,
# but is not part of the public documentation site.
exclude_docs: |
  migration/legacy-materials/**
  superpowers/**
  data-root-layout.md

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/chart-line
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

hooks:
  - project_tools/locale_navigation.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/runchengxie/quant-intel-platform
      name: GitHub

nav:
  - Market reports: https://runchengxie.github.io/quant-intel-pages/
  - Home: index.md
  - Language policy: LANGUAGE_POLICY.md
  - Getting started:
