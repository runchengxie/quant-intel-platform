site_name: Quant Market Intel · Documentation
site_description: Public framework for market intelligence, reporting, dashboards, and contracts
site_url: https://runchengxie.github.io/quant-intel-platform/docs/
repo_url: https://github.com/runchengxie/quant-intel-platform
repo_name: runchengxie/quant-intel-platform
edit_uri: edit/main/docs/

# Historical/private migration material is kept in the repository for traceability,
# but is not part of the public documentation site.
exclude_docs: |
  migration/legacy-materials/**
  superpowers/**

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/chart-line
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

hooks:
  - project_tools/locale_navigation.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/runchengxie/quant-intel-platform
      name: GitHub

nav:
  - Daily site: https://runchengxie.github.io/quant-intel-platform/
  - Home: index.md
  - Getting started:
      - Five-minute setup: getting-started.md
      - Core concepts: concepts.md
  - Common tasks:
      - Run the daily report: how-to/run-daily-report.en.md
      - Build the web dashboard: how-to/build-dashboard.en.md
      - Market report website: how-to/market-site.en.md
      - Add a data source: how-to/add-data-source.en.md
      - FAQ: faq.en.md
  - Understand the platform:
      - System architecture: architecture.md
      - Data ownership: data-ownership.en.md
      - Cross-repository boundary contract: boundary-contract.en.md
      - Artifact contracts: contracts.md
      - Glossary: glossary.en.md
  - Usage and configuration:
      - Configuration: configuration.md
      - CLI reference: cli-reference.en.md
      - Data-fetch architecture: data-fetch-architecture.md
      - Scoring method: scoring.en.md
      - Technical-analysis method: ta-methodology.en.md
      - Rate limits: rate-limits.en.md
  - Operations and development:
      - Operations: operations.md
      - Testing: testing.en.md
      - Workflows: workflows.en.md
      - Report structure: report-structure.en.md
      - Web dashboard research note: web-dashboard.en.md
      - Daily schedule: daily-schedule.en.md
      - Report delivery: report-distribution.en.md
      - Maintenance scripts: maintenance-scripts.en.md
      - Roadmap: roadmap.en.md
      - New-machine setup: new-machine-setup.en.md
      - Code-quality audit record: code-quality-audit-findings.en.md
  - Analysis and research:
      - A-share factor-signal research archive: a-share-factor-signals.en.md
      - Hotspot composite: hotspot-composite.en.md
      - ETL/report refactor record: refactor-plan-etl-report.en.md
      - Platform publication: platform-publication.en.md
      - Hermes workflow: hermes-agent-workflow.en.md
      - Cashflow shadow delivery: cashflow-feishu-shadow.en.md
  - Release notes:
      - Public repository boundary: public-release/public-boundary.en.md
      - Public release checklist: public-release/public-release-checklist.en.md
      - Data provenance: public-release/data-provenance.en.md
  - 简体中文:
      - 文档首页: index.zh-CN.md
      - 五分钟开始: getting-started.zh-CN.md
      - 核心概念: concepts.zh-CN.md
      - 系统架构: architecture.zh-CN.md
      - 配置说明: configuration.zh-CN.md
      - 产物契约: contracts.zh-CN.md
      - 跨市场数据与报告架构: data-fetch-architecture.zh-CN.md
      - 运维约定: operations.zh-CN.md
      - 语言与本地化规范: LANGUAGE_POLICY.zh-CN.md
