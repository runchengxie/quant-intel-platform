name: Public website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Install website dependencies
        working-directory: web
        run: |
          npm ci
          python -m pip install --group dev
      - name: Check website
        working-directory: web
        run: |
          ruff check scripts tests tools
          ruff format --check scripts tests tools
          ty check
          vulture scripts tests tools --min-confidence 80
          python -m pytest
          node --test tests/*.cjs
          node --check src/legacy/app.js
          python scripts/build_site.py --output "${{ runner.temp }}/website-check"
      - name: Build market website
        working-directory: web
        env:
          SITE_OUTPUT: ${{ runner.temp }}/public-site
        run: python scripts/build_site.py --output "$SITE_OUTPUT"
      - name: Build documentation under /docs
        run: uv run mkdocs build --strict --site-dir "${{ runner.temp }}/public-site/docs"
      - name: Upload public report ledger for the private publisher
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: market-intel-ledger-${{ github.run_id }}-1
          path: |
            web/artifacts/public/data
            web/artifacts/public/reports
          if-no-files-found: error
          retention-days: 7
      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-site-preview
          path: ${{ runner.temp }}/public-site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy combined website
        id: deployment
        uses: actions/deploy-pages@v4
