name: Public framework quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-intel-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install public dependencies
        run: uv sync --locked --group dev

      - name: Check public boundary
        run: uv run python scripts/public_release/check_boundary.py

      - name: Lint
        run: uv run ruff check src tests project_tools

      - name: Format changed Python files
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
          mapfile -t files < <(git diff --name-only "$base_sha" "$GITHUB_SHA" -- '*.py')
          if ((${#files[@]} == 0)); then
            echo "No changed Python files."
          else
            uv run ruff format --check "${files[@]}"
          fi

      - name: Type check
        run: uv run ty check

      - name: Offline contract and regression tests
        run: >-
          uv run pytest -q
          tests/public_release
          tests/test_contracts.py
          tests/test_boundary_contract.py
          tests/test_news_contract.py
          tests/test_digest_snapshot.py
          tests/test_report_delivery_smoke.py
          tests/test_style_replica_delivery_guard.py

      - name: Build package
        run: uv build
