name: Complete quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-intel-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} full gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install public dependencies
        run: uv sync --locked --group dev

      - name: Install shell quality tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends shellcheck

      - name: Run the complete repository gate
        env:
          DATA_PLATFORM_ROOT: ${{ runner.temp }}/data-platform
        run: uv run python project_tools/check_all.py --scope all --strict-tools

      - name: Check public boundary
        run: uv run python scripts/public_release/check_boundary.py

      - name: Build package
        run: uv build
