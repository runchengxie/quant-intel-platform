[project]
name = "quant-intel-pages"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "setuptools==83.0.0",
    "ruff==0.16.8",
    "ty==0.0.82",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.1",
    "radon==6.0.1",
    "vulture==2.16",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "C901", "RUF100"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["scripts", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
fail_under = 85
show_missing = true
